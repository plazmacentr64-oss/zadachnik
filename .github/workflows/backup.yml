name: Резервная копия базы
on:
  schedule:
    - cron: '0 23 * * *'   # каждый день в 03:00 по Саратову
  workflow_dispatch: {}     # можно запустить вручную: Actions → Резервная копия базы → Run workflow
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Выгрузка базы и шифрование
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "Не заданы секреты SUPABASE_DB_URL и BACKUP_PASSPHRASE"; exit 1; fi
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -Fc' > db.dump
          test -s db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "zadachnik-$(date +%F).dump.gpg" db.dump
          rm -f db.dump
          ls -la *.gpg
      - name: Сохранить копию (30 дней)
        uses: actions/upload-artifact@v4
        with:
          name: zadachnik-backup-${{ github.run_number }}
          path: '*.gpg'
          retention-days: 30
