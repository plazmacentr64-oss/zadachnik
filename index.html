<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Задачник">
  <meta name="application-name" content="Задачник Пикачу">
  <title>Задачник Пикачу</title>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=18">
  <link rel="stylesheet" href="styles.css?v=34">
</head>
<body>

  <div id="authGate" class="authgate on">
    <div class="authcard">
      <div class="eyebrow">CRM TEAM</div>
      <h2>Вход в CRM</h2>
      <p>Общая база объектов и задач для команды.</p>
      <label class="field">E-mail
        <input id="authEmail" type="email" autocomplete="email" placeholder="name@company.ru">
      </label>
      <label class="field">Пароль
        <input id="authPass" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
      </label>
      <div class="actions">
        <button class="btn secondary" id="signUpBtn">Создать аккаунт</button>
        <button class="btn" id="signInBtn">Войти</button>
      </div>
      <div id="authErr" class="autherr"></div>
    </div>
  </div>

  <main class="app">
    <div class="teamtop">
      <div id="teamUser" class="teamuser">Подключение…</div>
      <div style="display:flex;gap:5px">
        <button id="teamBtn" class="chip" style="display:none" onclick="openTeam()">Команда</button>
        <span id="syncDot" class="syncdot">SERVER</span>
        <button id="signOutBtn" class="chip" style="display:none">Выйти</button>
      </div>
    </div>

    <section id="todayView" class="view">
      <div class="top">
        <div class="eyebrow">ФОКУС НА СЕГОДНЯ</div>
        <h1>Сегодня</h1>
        <div id="todaySummary" class="summary"></div>
      </div>
      <div id="todayBody"></div>
    </section>

    <section id="objectsView" class="view on">
      <div class="top">
        <div class="head">
          <h1>Мои объекты</h1>
          <button class="btn" onclick="openProject()">+ Добавить</button>
        </div>
        <div id="summary" class="summary"></div>
        <div class="filters">
          <button class="chip on" data-b="active">Активные</button>
          <button class="chip" data-b="debt">Ждём оплату</button>
          <button class="chip" data-b="docs">Нужны документы</button>
          <button class="chip" data-b="archive">Архив</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="tasksView" class="view">
      <div class="top">
        <div class="head">
          <div>
            <h1>Задачи</h1>
            <div id="tasksSummary" class="summary"></div>
          </div>
          <button class="btn" onclick="openTask()">+ Новая задача</button>
        </div>
      </div>
      <div id="taskList"></div>
    </section>

    <section id="woodView" class="view">
      <div class="top">
        <div class="head">
          <h1>Дерево</h1>
        </div>
        <div class="summary">Объекты, для которых нужно дерево</div>
        <div class="woodFilters">
          <select id="woodProjectFilter" onchange="woodFilter=this.value;renderWood()"></select>
        </div>
      </div>
      <div id="woodBody"></div>
    </section>

    <section id="analyticsView" class="view">
      <div class="top">
        <div class="eyebrow">ФИНАНСОВЫЙ ПУЛЬС</div>
        <h1>Аналитика</h1>
        <div class="summary">Деньги и объекты — без лишнего шума</div>
      </div>
      <div id="analyticsBody"></div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab" data-v="today"><i>●</i>Сегодня</button>
    <button class="tab on" data-v="objects"><i>▦</i>Объекты</button>
    <button class="tab" data-v="tasks"><i>✓</i>Задачи</button>
    <button class="tab" data-v="wood"><i>▤</i>Дерево</button>
    <button class="tab" data-v="analytics"><i>⌁</i>Аналитика</button>
  </nav>

  <div id="modal" class="modal">
    <div id="sheet" class="sheet"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=36"></script>
  <script src="wood-wheels.js?v=32"></script>
  <script src="rounded-selects.js?v=31"></script>
  <script src="document-gen.js?v=2"></script>
</body>
</html>
